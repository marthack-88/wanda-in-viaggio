<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wanda in viaggio</title>
<meta name="theme-color" content="#6CC3E6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wanda">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23FF5E5B'/%3E%3Cpath d='M4 15V9a2 2 0 0 1 2-2h8a4 4 0 0 1 4 4v4z' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
[hidden]{display:none!important}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: app di viaggio a schermo diviso. Mappa a tutta altezza a sinistra, diario che scorre a destra; su telefono mappa fissa in alto. */
:root{
  --bg:#F4F6F2; --panel:#FFFFFF; --ink:#16241D; --muted:#66756C; --line:#E4E9E2; --soft:#EEF3EC;
  --sea:#BFDCE6; --land:#F4F2E8; --coast:#A3BFBB; --grid:rgba(40,80,90,.10);
  --route:#EE6A3C; --route-ink:#fff; --accent:#245C45; --accent-ink:#fff; --danger:#C0392B; --sun:#F2B544;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --shadow:0 1px 2px rgba(16,36,29,.05),0 12px 28px -18px rgba(16,36,29,.35);
  --mapw:minmax(0,1fr); --sidew:minmax(0,600px);
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--font-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.08;letter-spacing:-.02em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* struttura */
.app{display:grid;grid-template-columns:var(--mapw) var(--sidew);align-items:start;min-height:100vh}
.mapcol{position:sticky;top:0;height:100vh;height:100dvh;padding:0}
.side{min-width:0;padding-block:20px 48px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.layout.story{grid-template-columns:minmax(0,1fr)}
.layout.story .mapcol{display:none}
.layout.story .side{width:100%;max-width:820px;margin:0 auto}

/* mappa */
.mapbox{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none;cursor:grab;
  background:radial-gradient(120% 90% at 30% 20%,#D4E8EE 0%,#BBD8E3 60%,#A9CDDA 100%)}
.mapbox.picking{cursor:crosshair;box-shadow:inset 0 0 0 4px var(--route)}
.mapbox:active{cursor:grabbing}
#map{display:block;width:100%;height:100%;user-select:none}
.mapctl{position:absolute;right:16px;top:max(16px,env(safe-area-inset-top,0px));display:flex;flex-direction:column;background:var(--panel);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.mapctl button{width:40px;height:40px;border:0;border-bottom:1px solid var(--line);background:transparent;cursor:pointer;font:500 18px var(--font-body);color:var(--ink)}
.mapctl button:last-child{border-bottom:0}
.mapctl button:hover{background:var(--soft)}
.mapctl button.fit{font:600 10px var(--font-mono);letter-spacing:.06em}
.mapbadge{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:16px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:7px 12px 7px 8px;border-radius:99px;box-shadow:var(--shadow);font:600 13px var(--font-body)}
.mapbadge i{width:24px;height:24px;border-radius:50%;background:var(--route);display:grid;place-items:center}
.mapbadge i svg{width:14px;height:14px}
.mapbadge span{color:var(--muted);font-weight:500}
.pickbar{position:absolute;left:16px;right:72px;top:16px;background:var(--route);color:#fff;padding:10px 14px;border-radius:12px;font-weight:600;display:flex;gap:10px;justify-content:space-between;align-items:center;box-shadow:var(--shadow)}
.pickbar[hidden]{display:none}
.pickbar button{border:1px solid currentColor;background:transparent;border-radius:8px;padding:2px 10px;cursor:pointer;color:#fff}
.t-sea{font:italic 500 13px var(--font-display);fill:#6E9AAA;letter-spacing:.16em}
.t-city{font:500 12px var(--font-body);fill:#3D4D45;paint-order:stroke;stroke:rgba(255,255,255,.9);stroke-width:3px;stroke-linejoin:round}
.t-grid{font:10px var(--font-mono);fill:#6E8A90}
.pinnum{font:700 12px var(--font-body);fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pinnum.f{fill:var(--route)}
.t-stop{font:700 12.5px var(--font-body);fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.pin{cursor:pointer}
@keyframes pulse{0%{r:18;opacity:.4}100%{r:34;opacity:0}}
.vanpulse{animation:pulse 1.8s ease-out infinite;fill:var(--route)}
.mapnote{font-size:12px;color:var(--muted);margin:28px 0 0}

/* testata */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;justify-content:space-between}
.brand{font:700 19px var(--font-display);letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand i{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#F48455,#E35A2C);display:grid;place-items:center;box-shadow:0 6px 14px -6px rgba(227,90,44,.7)}
.brand i svg{width:18px;height:18px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:11px;cursor:pointer;font-weight:600;font-size:14px;min-height:38px;box-shadow:0 1px 2px rgba(16,36,29,.06);transition:box-shadow .15s,border-color .15s}
.btn:hover{border-color:#C9D3C9;box-shadow:0 6px 14px -8px rgba(16,36,29,.35)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.route{background:var(--route);color:var(--route-ink);border-color:var(--route)}
.btn.danger{color:var(--danger);border-color:#EBC3BE;background:transparent;box-shadow:none}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent}
.btn.sm{min-height:32px;padding:5px 12px;font-size:13px}
select.btn{max-width:100%;padding-right:8px}
.notice{margin:14px 0 0;padding:9px 12px;border-radius:12px;background:#FFF4E8;color:#8A5A2B;font-size:13px}

/* copertina viaggio */
.hero{position:relative;overflow:hidden;margin-top:18px;border-radius:24px;padding:26px 24px 104px;color:#fff;
  background:radial-gradient(60% 70% at 85% 18%,rgba(255,214,140,.55) 0,rgba(255,214,140,0) 60%),linear-gradient(168deg,#173F31 0%,#245C45 45%,#4E8A64 100%);box-shadow:0 24px 40px -26px rgba(20,60,40,.8)}
.hero:empty{display:none}
.hero .kicker{font:500 11px var(--font-mono);letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.hero h1{font-size:clamp(28px,4.2vw,44px);margin:8px 0 6px;position:relative}
.hero .sub{font-size:14px;opacity:.9}
.hero .hnote{margin:10px 0 0;font-size:14px;opacity:.85;max-width:52ch}
.stats{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.stat{display:flex;flex-direction:column;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:8px 14px;min-width:84px}
.stat b{font:500 20px var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.stat span{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;opacity:.8}
.scene{position:absolute;left:0;bottom:0;width:100%;height:90px;pointer-events:none}

/* schede */
.tabs{display:flex;gap:2px;align-items:center;margin:22px 0 18px;background:#E7ECE5;border-radius:14px;padding:4px;position:sticky;top:max(10px,env(safe-area-inset-top,0px));z-index:7}
.tab{background:none;border:0;border-radius:10px;padding:8px 14px;cursor:pointer;font:600 14px var(--font-body);color:var(--muted)}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 2px 8px -3px rgba(16,36,29,.3)}
.tabs .spacer{flex:1}

/* tappe */
.stops{list-style:none;margin:0;padding:0;position:relative;display:flex;flex-direction:column;gap:14px}
.stops::before{content:"";position:absolute;left:16px;top:20px;bottom:20px;border-left:2px solid var(--line)}
.stop{display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px;cursor:pointer;position:relative}
.node{width:34px;height:34px;border-radius:50%;background:var(--route);color:#fff;font:700 13px var(--font-body);display:grid;place-items:center;z-index:1;box-shadow:0 0 0 4px var(--bg),0 4px 10px -4px rgba(238,106,60,.8);margin-top:14px}
.card,.dc{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 18px;min-width:0;box-shadow:var(--shadow);transition:box-shadow .2s,border-color .2s}
.stop.sel .card,.dcard.cur .dc{border-color:var(--route);box-shadow:0 0 0 4px rgba(238,106,60,.12),0 16px 30px -20px rgba(238,106,60,.6)}
.meta,.dd{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:12px;color:var(--muted)}
.date{font:500 11.5px var(--font-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--route);background:rgba(238,106,60,.1);padding:2px 8px;border-radius:7px}
.dd{font:500 11.5px var(--font-mono);text-transform:uppercase;letter-spacing:.05em}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 10px 2px 7px;font:600 12px var(--font-body);text-transform:none;letter-spacing:0;color:var(--accent);background:rgba(36,92,69,.09)}
.chip svg{width:14px;height:14px;flex:none}
.card h3,.dc h3{font-size:20px;margin-top:8px}
.place{margin:3px 0 0;color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}
.coord{font-family:var(--font-mono);font-size:11px;opacity:.75}
.note{margin:10px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
.facts{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;font:500 12px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.facts span{background:var(--soft);padding:3px 9px;border-radius:8px}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:14px}
.strip img,.strip .more{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:zoom-in;background:var(--soft)}
.strip img:first-child{grid-column:1/-1;aspect-ratio:16/10;border-radius:14px}
.strip .more{display:grid;place-items:center;font:600 13px var(--font-mono);color:var(--accent);cursor:pointer}
.actions{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.actions a{font-size:13px;color:var(--accent);font-weight:600;text-decoration:none}
.actions a:hover{text-decoration:underline}
a.btn{color:var(--ink);text-decoration:none;display:inline-flex;align-items:center}
.tabs .btn{white-space:nowrap}

.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gallery figure{margin:0;position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;background:var(--soft);cursor:zoom-in;box-shadow:var(--shadow)}
.gallery img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.gallery figure:hover img{transform:scale(1.04)}
.gallery figcaption{position:absolute;left:0;right:0;bottom:0;padding:24px 10px 8px;font-size:12px;font-weight:600;color:#fff;background:linear-gradient(transparent,rgba(8,20,14,.7));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.empty{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px 24px;box-shadow:var(--shadow)}
.empty h2{font-size:24px;margin-bottom:8px}
.empty p{color:var(--muted);max-width:52ch;margin:0 0 16px}
.empty .row{display:flex;flex-wrap:wrap;gap:8px}

/* giorni */
.dbar{position:sticky;top:calc(max(10px,env(safe-area-inset-top,0px)) + 56px);z-index:6;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;padding:14px 16px 10px;margin-bottom:18px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 16px;align-items:center;box-shadow:0 18px 36px -24px rgba(16,36,29,.55)}
.dtrip{grid-column:1/-1;font:600 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbar .big{display:flex;align-items:baseline;gap:6px;font:600 13px var(--font-body);color:var(--muted)}
.dbar .big i{font-style:normal}
.dbar .big b{font:600 46px/.95 var(--font-display);color:var(--route);letter-spacing:-.04em;font-variant-numeric:tabular-nums;min-width:1.1ch}
.dbar .big span{font:500 14px var(--font-mono);white-space:nowrap}
.dbar .dmeta{display:flex;flex-direction:column;min-width:0}
.dbar .dmeta b{font:700 16px/1.25 var(--font-display)}
.dbar .dmeta b::first-letter{text-transform:uppercase}
.dbar .dmeta span{font-size:12px;color:var(--muted)}
.dctl{display:flex;gap:4px;background:var(--soft);border-radius:12px;padding:3px}
.dctl button{width:34px;height:34px;border-radius:9px;border:0;background:transparent;cursor:pointer;font-size:15px;color:var(--ink)}
.dctl button:hover{background:var(--panel)}
.dctl button.play{background:var(--route);color:#fff}
.dbar input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--route);height:24px;margin:0}
.days{display:flex;flex-direction:column;gap:12px}
.dcard{display:grid;grid-template-columns:54px minmax(0,1fr);gap:12px;cursor:pointer;transition:opacity .3s}
.dcard.next{opacity:.5}
.dcard .dn{text-align:center;position:relative;padding-top:12px}
.dcard .dn small{display:block;font:600 9.5px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.dcard .dn b{font:600 28px/1.05 var(--font-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.dcard .dn::after{content:"";position:absolute;left:50%;top:62px;bottom:-14px;border-left:2px solid var(--line)}
.dcard.cur .dn b{color:var(--route)}
.dcard.stay .dc,.dcard.gap .dc{padding:11px 16px;background:transparent;box-shadow:none;border-style:dashed}
.stayline{font-size:14px;color:var(--muted);margin-top:2px}
.stayline b{color:var(--ink);font-weight:600}
.tbanner{position:relative;overflow:hidden;border-radius:22px;padding:22px 22px 92px;margin:22px 0 4px;color:#fff;
  background:radial-gradient(60% 70% at 85% 18%,rgba(255,214,140,.5) 0,rgba(255,214,140,0) 60%),linear-gradient(168deg,#173F31 0%,#245C45 45%,#4E8A64 100%);box-shadow:0 22px 40px -26px rgba(20,60,40,.8)}
.days>.tbanner:first-child{margin-top:0}
.tb-k{font:500 11px var(--font-mono);letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.tbanner h2{font-size:clamp(24px,3.6vw,34px);margin:6px 0 6px}
.tb-d{font:500 12px var(--font-mono);opacity:.9}
.tbanner p{margin:10px 0 0;font-size:14.5px;line-height:1.6;max-width:56ch;white-space:pre-wrap;opacity:.92}

/* racconto */
.book{display:flex;flex-direction:column;gap:36px}
.cover{position:relative;overflow:hidden;border-radius:26px;padding:36px 30px 120px;color:#fff;
  background:radial-gradient(60% 70% at 85% 18%,rgba(255,214,140,.55) 0,rgba(255,214,140,0) 60%),linear-gradient(168deg,#173F31 0%,#245C45 45%,#4E8A64 100%);box-shadow:0 26px 44px -28px rgba(20,60,40,.85)}
.cover .kicker{font:500 11px var(--font-mono);letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.cover h2{font-size:clamp(34px,6vw,58px);margin:12px 0 8px;letter-spacing:-.03em}
.cover .when{font:500 13px var(--font-mono);opacity:.9}
.cover p.intro{margin:18px 0 0;font-size:17px;line-height:1.7;max-width:56ch;white-space:pre-wrap;opacity:.95}
.cover .scene{height:110px}
.chap{display:flex;flex-direction:column;gap:12px}
.chap .no{font:500 11px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--route)}
.chap h3{font-size:clamp(26px,4vw,36px);letter-spacing:-.025em}
.chap .where{color:var(--muted);font-size:14px}
.polaroid{margin:6px 0}
.polaroid img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:20px;cursor:zoom-in;box-shadow:0 24px 44px -26px rgba(16,36,29,.75)}
.polaroid figcaption{font-size:13px;color:var(--muted);padding:8px 4px 0}
.chap .text{font-size:17.5px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere;max-width:62ch}
.chap .text.none{color:var(--muted);font-style:italic;font-size:15px}
.chap .more{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.chap .more img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;cursor:zoom-in;background:var(--soft)}
.leg{font:500 12px var(--font-mono);color:var(--muted);display:flex;align-items:center;gap:12px}
.leg::before,.leg::after{content:"";flex:1;border-top:1px solid var(--line)}
.endcard{border:1px solid var(--line);background:var(--panel);border-radius:22px;padding:24px;box-shadow:var(--shadow)}
.endcard h3{font-size:24px;margin-bottom:8px}
.endcard p{margin:0 0 8px;font-size:16.5px;line-height:1.7;white-space:pre-wrap}
.endcard .best{font-family:var(--font-display);font-size:19px}

/* finestre */
.overlay{position:fixed;inset:0;background:rgba(10,22,16,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:50;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.overlay.hide{display:none}
.sheet{background:var(--panel);border-radius:22px;width:min(560px,100%);max-height:100%;overflow:auto;padding:24px;box-shadow:0 40px 80px -30px rgba(10,22,16,.6)}
.sheet h2{font-size:24px;margin-bottom:16px}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;min-width:0}
.fld label{font-size:12px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:10px 12px;min-width:0;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(36,92,69,.15)}
.fld textarea{min-height:96px;resize:vertical}
.fld small{color:var(--muted);font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.coordrow{display:flex;gap:8px;flex-wrap:wrap}
.coordrow input{flex:1 1 160px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.thumb{position:relative;width:76px;height:76px}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:12px}
.thumb button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:#fff;cursor:pointer;font-size:13px;line-height:1}
.foot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:10px}
.foot .grp{display:flex;gap:8px;flex-wrap:wrap}
.err{color:var(--danger);font-size:13px;min-height:18px;margin:0 0 6px}
.lb{background:rgba(6,12,9,.94);flex-direction:column;gap:12px}
.lb img{max-width:100%;max-height:78vh;object-fit:contain;border-radius:10px}
.lb .cap{color:#fff;font-size:14px;text-align:center}
.lb .bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.lb .btn{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.2)}

@media (max-width:1000px){
  :root{--sidew:minmax(0,480px)}

/* ===== colori ===== */
:root{--sea:#BDE8F1;--land:#FFF8EA;--coast:#7CC3D3;--route:#FF5E5B;--accent:#6C4AB6;--sun:#FFB547}
html{background:#FFF6EF}
body{background:
  radial-gradient(42vw 42vw at 100% 0%,rgba(255,159,128,.55),transparent 70%),
  radial-gradient(38vw 38vw at 55% 35%,rgba(255,214,120,.35),transparent 70%),
  radial-gradient(45vw 45vw at 100% 70%,rgba(108,74,182,.28),transparent 70%),
  radial-gradient(40vw 40vw at 60% 105%,rgba(43,163,184,.38),transparent 70%),
  #FFF6EF;background-attachment:fixed}
.mapbox{background:radial-gradient(120% 90% at 30% 20%,#CFF1F7 0%,#9EDCEB 60%,#7FCDE2 100%)}
.t-sea{fill:#3E95AE}
.mapcol{box-shadow:6px 0 30px -18px rgba(60,30,90,.5)}
.brand i{background:linear-gradient(135deg,#FF8A5B,#FF4F7B)}
.btn{background:rgba(255,255,255,.85)}
.btn.primary{background:linear-gradient(135deg,#7B5BD6,#C2479A);border-color:transparent;color:#fff}
.btn.route{background:linear-gradient(135deg,#FF8A5B,#FF4F7B);border-color:transparent;color:#fff}
.notice{background:rgba(255,255,255,.75);color:#7A4A2B}
.stat{background:rgba(25,10,45,.2);border-color:rgba(255,255,255,.25)}
.hero h1,.tbanner h2,.cover h2{text-shadow:0 2px 14px rgba(20,8,40,.25)}
.tabs{background:rgba(255,255,255,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 8px 24px -16px rgba(60,30,90,.45)}
.tab[aria-selected="true"]{background:linear-gradient(135deg,#FF8A5B,#FF4F7B);color:#fff;box-shadow:0 6px 14px -6px rgba(255,79,123,.7)}
.node{background:linear-gradient(135deg,#FF8A5B,#FF4F7B);box-shadow:0 0 0 4px rgba(255,255,255,.9),0 6px 12px -4px rgba(255,79,123,.7)}
.stops::before,.dcard .dn::after{border-left:2px dashed rgba(255,94,91,.35)}
.card,.dc,.empty,.endcard{background:rgba(255,255,255,.92);border-color:rgba(255,255,255,.9);box-shadow:0 1px 2px rgba(60,30,90,.06),0 16px 32px -20px rgba(60,30,90,.4)}
.stop.sel .card,.dcard.cur .dc{border-color:#FF5E5B;box-shadow:0 0 0 4px rgba(255,94,91,.15),0 18px 34px -18px rgba(255,79,123,.55)}
.dcard.stay .dc,.dcard.gap .dc{background:rgba(255,255,255,.45);border-color:rgba(108,74,182,.25);box-shadow:none}
.date{background:linear-gradient(135deg,rgba(255,138,91,.18),rgba(255,79,123,.18));color:#D93A55}
.chip.k1{background:#FFE7DC;color:#C2491E}.chip.k2{background:#E3F6E8;color:#24804A}.chip.k3{background:#E0F3F7;color:#1A7F96}
.chip.k4{background:#FFF1D1;color:#9A6500}.chip.k5{background:#ECE6FA;color:#5A3DA6}.chip.k6{background:#FDE3EC;color:#B6345F}
.facts span{background:#F3EEFB;color:#5A3DA6}
.facts span:nth-child(2){background:#E0F3F7;color:#1A7F96}
.facts span:nth-child(3){background:#FFF1D1;color:#9A6500}
.dbar{background:rgba(255,255,255,.82)}
.dtrip{color:#6C4AB6}
.dbar .big b{background:linear-gradient(135deg,#FF8A5B,#FF4F7B);-webkit-background-clip:text;background-clip:text;color:transparent}
.dctl{background:rgba(108,74,182,.08)}
.dctl button.play{background:linear-gradient(135deg,#FF8A5B,#FF4F7B)}

.chap .no{color:#D93A55}

/* ===== testata illustrata e mappa a scomparsa ===== */
html{background:#EAF6FA}
body{background:linear-gradient(180deg,#EAF6FA 0%,#FFF7EE 55%,#FFF1E4 100%);background-attachment:fixed}
.scene-hero{position:relative;overflow:hidden;background:linear-gradient(180deg,#6CC3E6 0%,#A6DBEE 42%,#FFE6C6 70%,#FFD9AE 100%)}
.scene-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene-hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(180deg,rgba(234,246,250,0),#EAF6FA);pointer-events:none}
.hero-inner{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding-block:18px 190px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.scene-hero .brand{color:#0F3550}
.scene-hero .btn{background:rgba(255,255,255,.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-color:rgba(255,255,255,.8)}
.hero-title{margin-top:34px;max-width:640px}
.wanda{font:800 clamp(46px,8.5vw,96px)/.92 var(--font-display);letter-spacing:-.045em;color:#0F3550}
.wanda span{color:#FF5E5B;display:inline-block}
.hero-title p{margin:14px 0 0;font-size:clamp(15px,2vw,18px);color:#1E4B66;font-weight:500}
.app{display:block;min-height:0}
.side{max-width:880px;margin:-90px auto 0;position:relative;z-index:2;padding-block:0 56px}
.layout.story .side{max-width:880px}
.hero{margin-top:12px}
.tabs{top:max(10px,env(safe-area-inset-top,0px));overflow-x:auto}
.dbar{top:calc(max(10px,env(safe-area-inset-top,0px)) + 58px)}
.mapslot{position:relative;overflow:hidden}
.mapslot.big{height:min(68vh,620px);border-radius:24px;box-shadow:0 24px 46px -26px rgba(16,50,70,.6);border:3px solid #fff}
.mapslot.mini{grid-column:1/-1;height:200px;border-radius:14px;margin-top:4px}
.mapslot.mini .mapbadge,.mapslot.mini .mapctl .fit{display:none}
.mapslot.mini .mapctl{right:8px;top:8px}
.mapslot.mini .mapctl button{width:30px;height:30px;font-size:15px}
.maplegend{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.lg{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.85);border-radius:99px;padding:5px 12px 5px 5px;cursor:pointer;font:600 13px var(--font-body);box-shadow:0 6px 14px -10px rgba(60,30,90,.5)}
.lg b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#FF8A5B,#FF4F7B);color:#fff;font-size:12px}
.lg.on{border-color:#FF5E5B;box-shadow:0 0 0 3px rgba(255,94,91,.18)}
.pickwrap{width:min(1100px,100%);height:min(84vh,760px);border-radius:22px;overflow:hidden;box-shadow:0 40px 80px -30px rgba(0,0,0,.6)}
.mapnote{display:none}
@media (max-width:760px){
  .hero-inner{padding-block:14px 150px}
  .hero-title{margin-top:22px}
  .side{margin-top:-60px}
  .tabs{top:max(8px,env(safe-area-inset-top,0px))}
  .dbar{top:calc(max(8px,env(safe-area-inset-top,0px)) + 56px)}

.scene-hero .btn.primary{background:linear-gradient(135deg,#7B5BD6,#C2479A);color:#fff;border-color:transparent}
.wanda{text-shadow:0 2px 0 rgba(255,255,255,.35)}

/* ===== carosello viaggi ===== */
.tripwrap{position:relative;margin-top:12px}
.tripcar{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:4px 6% 34px;-webkit-overflow-scrolling:touch}
.tripcar::-webkit-scrollbar{display:none}
.tripcar .hero{flex:0 0 88%;scroll-snap-align:center;margin-top:0;opacity:.6;transform:scale(.95);transition:transform .35s,opacity .35s;cursor:pointer}
.tripcar .hero.on{opacity:1;transform:none;cursor:default}
.tripcar.single{padding-inline:0}
.tripcar.single .hero{flex-basis:100%;opacity:1;transform:none}
.hero h2{font-size:clamp(28px,4.2vw,44px);margin:8px 0 6px;position:relative;text-shadow:0 2px 14px rgba(20,8,40,.25)}
.carbtn{position:absolute;top:calc(50% - 40px);z-index:3;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.92);box-shadow:0 8px 20px -8px rgba(40,20,70,.5);font:500 26px/1 var(--font-body);color:var(--ink);cursor:pointer;display:grid;place-items:center;padding-bottom:3px}
.carbtn:hover{background:#fff}
.carbtn.prev{left:-4px}.carbtn.next{right:-4px}
.cardots{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:6px}
.cdot{width:8px;height:8px;border-radius:99px;border:0;padding:0;background:rgba(108,74,182,.28);cursor:pointer;transition:width .25s,background .25s}
.cdot.on{width:24px;background:linear-gradient(135deg,#FF8A5B,#FF4F7B)}
.cover{scroll-margin-top:80px}
@media (max-width:760px){.carbtn{display:none}.tripcar{padding-inline:5%}.tripcar .hero{flex-basis:90%}}

/* ===== selezione rapida ===== */
.carhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 6% 8px}
.carhead span{font:600 13px var(--font-body);color:#1E4B66}
.allbtn{display:inline-flex;align-items:center;gap:6px}
.allbtn svg{width:15px;height:15px}
.allsheet{width:min(520px,100%);display:flex;flex-direction:column;max-height:min(80vh,720px)}
.allhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.allhead h2{margin:0}
.alllist{overflow-y:auto;margin:0 -8px;padding:0 8px;display:flex;flex-direction:column;gap:4px}
.allyear{font:600 11px var(--font-mono);letter-spacing:.14em;color:var(--muted);margin:12px 4px 4px;position:sticky;top:0;background:var(--panel);padding:4px 0;z-index:1}
.allrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:14px;padding:8px;cursor:pointer}
.allrow:hover{background:var(--soft)}
.allrow.on{border-color:rgba(255,94,91,.4);background:rgba(255,94,91,.06)}
.allrow i{width:44px;height:44px;border-radius:12px;flex:none}
.allrow span{display:flex;flex-direction:column;min-width:0;flex:1}
.allrow b{font:600 15px var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.allrow small{font-size:12px;color:var(--muted)}
.allrow em{font:600 11px var(--font-body);font-style:normal;color:#fff;background:linear-gradient(135deg,#FF8A5B,#FF4F7B);border-radius:99px;padding:2px 8px}
.allnone{color:var(--muted);padding:12px 4px}
@media (max-width:760px){.carhead{margin-inline:5%}}

/* ===== versione esterna ===== */
#map{width:100%;height:100%;background:#CFEAF2}
.leaflet-container{font-family:var(--font-body)}
.mapctl,.mapbadge,.pickbar{z-index:1000}
.mapslot.mini .leaflet-control-scale{display:none}
.lwrap{background:none;border:0}
.lpin{position:absolute;left:-14px;top:-14px;display:flex;align-items:center;gap:6px;white-space:nowrap;pointer-events:auto}
.lpin b{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#FF8A5B,#FF4F7B);color:#fff;font:700 12px var(--font-body);display:grid;place-items:center;border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.35);transition:transform .2s}
.lpin span{font:700 12.5px var(--font-body);color:var(--ink);text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 4px #fff,0 0 4px #fff}
.lpin.f b{background:#fff;color:#FF5E5B;border-color:#FF5E5B}
.lpin.f span{opacity:.6}
.lpin.sel b{transform:scale(1.25);box-shadow:0 0 0 6px rgba(255,94,91,.28),0 3px 8px rgba(0,0,0,.35)}
.lvan{position:absolute;left:-21px;top:-21px;width:42px;height:42px;border-radius:50%;background:#FF5E5B;border:3px solid #fff;display:grid;place-items:center;box-shadow:0 0 0 8px rgba(255,94,91,.25),0 4px 12px rgba(0,0,0,.4)}
.lvan svg{width:22px;height:22px}
.georesults{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.geo{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 10px;cursor:pointer}
.geo:hover{border-color:#FF5E5B}
.geo b{font-size:14px}.geo small{font-size:11.5px;color:var(--muted)}
body.locked .tabs,body.locked #tripbar,body.locked .tools{display:none}
body.locked .side{margin-top:-110px}
.login{max-width:520px;margin:0 auto}
.loginrow{display:flex;gap:8px;flex-wrap:wrap}
.loginrow input{flex:1 1 220px;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:var(--bg)}

/* ===== menu, schede, tappe, modulo (revisione usabilità) ===== */
.t-short{display:none}
.top{flex-wrap:nowrap}
.brand{min-width:0;white-space:nowrap}
.tools{flex-wrap:nowrap}
.menubtn{width:42px;padding:0;display:grid;place-items:center}
.menubtn svg{width:18px;height:18px}
.menulist{position:fixed;z-index:60;min-width:210px;background:#fff;border-radius:16px;padding:6px;display:flex;flex-direction:column;box-shadow:0 22px 44px -14px rgba(16,36,29,.5),0 0 0 1px rgba(16,36,29,.06)}

a.btn.nav{gap:6px;background:linear-gradient(135deg,#7B5BD6,#C2479A);color:#fff;border-color:transparent}

.fld.nights input{max-width:140px}
.loginform{max-width:380px}
.pwrow{position:relative}
.pwrow input{padding-right:48px}
.pweye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:none;border-radius:9px;cursor:pointer;color:var(--muted);display:grid;place-items:center}

.pweye.on{color:var(--accent)}
.btn.wide{width:100%;min-height:46px;font-size:15px}
.linkbtn{display:block;margin:14px auto 0;border:0;background:none;color:var(--accent);font-weight:600;font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

const S={calYear:null,trips:[],stops:[],tripId:null,tab:'stops',sel:null,loading:true,db:null,assets:null,canWrite:true,mode:'mem',view:null,userView:false,pick:false,dragged:false};

function initMap(){

/* ---------- elenco e pagina ---------- */
function selectStop(id,fromMap){S.sel=id;renderMap();renderContent();

const PEN='<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>';

function toContent(){const c=$('#content');window.scrollTo({top:c.getBoundingClientRect().top+window.scrollY-(isMobile()?12:76),behavior:'smooth'});}
function renderTop(){
  const sel=$('#tripSel');sel.innerHTML=S.trips.length?[...S.trips].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(t=>`<option value="${esc(t.id)}"${t.id===S.tripId?' selected':''}>${esc(t.name)}</option>`).join(''):'<option>Nessun viaggio</option>';

  const w=S.canWrite;$('#btnTripNew').hidden=!w;$('#btnStopNew').hidden=!w||!S.trips.length;
  const tb=$('#tripbar');const ts=tripsByDate();

  o+='<div class="tripcar'+(ts.length===1?' single':'')+'" id="tripcar">';
  ts.forEach((t,i)=>{
    const st=stopsOf(t.id);let dist=0;for(let k=1;k<st.length;k++)dist+=km(st[k-1],st[k]);
    const nights=st.reduce((a,s)=>a+(+s.nights||0),0),cost=st.reduce((a,s)=>a+(+s.cost||0),0),ph=st.reduce((a,s)=>a+((s.photos||[]).length),0);

    o+=`<article class="hero${t.id===S.tripId?' on':''}${coverUrl(t.id)?' photo':''}" data-trip="${esc(t.id)}" style="background:${esc(tripBg(t.id))}"><div class="kicker">Viaggio ${i+1} di ${ts.length} · Wanda</div><h2>${esc(t.name)}</h2><div class="sub">${esc(range)}</div>${t.notes?`<p class="hnote">${esc(t.notes)}</p>`:''}<div class="stats"><div class="stat"><b>${st.length}</b><span>tappe</span></div><div class="stat"><b>${nights}</b><span>notti</span></div><div class="stat" title="Somma delle distanze in linea d'aria tra tappe consecutive"><b>${nf(dist)}</b><span>km</span></div><div class="stat"><b>${nf(cost)}€</b><span>spesa</span></div><div class="stat"><b>${ph}</b><span>foto</span></div></div>${tripScene(t.id)}</article>`;

  const rows=ts.map(t=>{const st=stopsOf(t.id);let dist=0;for(let k=1;k<st.length;k++)dist+=km(st[k-1],st[k]);
    return{t,st,dist,year:st.length?st[0].date.slice(0,4):'Senza date',first:st.length?st[0].date:'',text:(t.name+' '+st.map(s=>(s.place||'')+' '+s.title).join(' ')).toLowerCase()};})

function daysOf(st){
  const add=(d,n)=>{const x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10);};
  const span=s=>Math.max(1,+s.nights||0);
  let end=st[0].date;st.forEach(s=>{const e=add(s.date,span(s)-1);if(e>end)end=e;});
  const out=[];let d=st[0].date,n=0;
  while(d<=end&&n<400){
    let idx=-1;st.forEach((s,i)=>{if(s.date<=d&&d<add(s.date,span(s)))idx=i;});
    let kind='start',night=0;
    if(idx<0){st.forEach((s,i)=>{if(s.date<d)idx=i;});kind='gap';}
    else if(st[idx].date!==d){kind='stay';night=Math.round((new Date(d+'T12:00:00Z')-new Date(st[idx].date+'T12:00:00Z'))/86400000)+1;}
    out.push({date:d,idx,kind,night,s:st[idx]});d=add(d,1);n++;
  }
  return out;
}
function buildAll(){
  const items=[],dayKs=[],ranges=[];
  const ts=tripsByDate().filter(t=>stopsOf(t.id).length);
  ts.forEach((t,ti)=>{
    const st=stopsOf(t.id),ds=daysOf(st);let dist=0;for(let i=1;i<st.length;i++)dist+=km(st[i-1],st[i]);
    const first=dayKs.length;
    items.push({type:'trip',t,ti,n:ts.length,days:ds.length,dist,first:ds[0].date,last:ds[ds.length-1].date,d:first});
    ds.forEach((d,i)=>{items.push(Object.assign({type:'day',t,ti,i,total:ds.length,st},d));dayKs.push(items.length-1);});
    ranges.push({start:first,end:dayKs.length-1,t});
  });
  return{items,dayKs,ranges,ts};
}

  const tripGo=d=>{stopPlay();const it=S.all.items[S.all.dayKs[S.dayCur]];const r=S.all.ranges[it.ti+d];if(r)goDay(r.start,true);};
  $('#tPrev').onclick=()=>{const it=S.all.items[S.all.dayKs[S.dayCur]];const r=S.all.ranges[it.ti];if(S.dayCur>r.start){stopPlay();goDay(r.start,true);}else tripGo(-1);};
  $('#tNext').onclick=()=>tripGo(1);
  $('#dPlay').onclick=()=>{if(playT){stopPlay();return;}
    if(S.dayCur>=A.dayKs.length-1)goDay(0,true);
    $('#dPlay').textContent='❚❚';
    playT=setInterval(()=>{if(S.dayCur>=S.all.dayKs.length-1){stopPlay();return;}goDay(S.dayCur+1,true);},2200);};
  S.dayStopIdx=null;updateDay(S.dayCur);
  if(S.enterDays){S.enterDays=false;goDay(S.dayCur,true,true);}
}

function parseCoords(s){
  s=(s||'').trim();if(!s)return null;
  let m=s.match(/^(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)$/);
  if(!m){const s2=s.replace(/(\d),(\d)/g,'$1.$2');m=s2.match(/^(-?\d+(?:\.\d+)?)\s*[;\s]\s*(-?\d+(?:\.\d+)?)$/);}
  if(!m)return null;const lat=+m[1],lon=+m[2];if(Math.abs(lat)>90||Math.abs(lon)>180)return null;return{lat,lon};
}

// mostra se la posizione della tappa è già impostata (le coordinate stanno in "Altri dettagli")
function coordStatus(){const el=$('#sCoordOk'),co=$('#sCoords');if(!el||!co)return;const c=parseCoords(co.value);
  el.classList.toggle('ok',!!c);el.textContent=c?'✓ Posizione impostata ('+c.lat.toFixed(4)+', '+c.lon.toFixed(4)+')':'Posizione non ancora impostata';}
// data proposta per una nuova tappa: il giorno dopo le notti dell'ultima tappa
function nextDate(last){if(!last||!last.date)return new Date().toISOString().slice(0,10);
  const d=new Date(last.date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+Math.max(0,+last.nights||0));return d.toISOString().slice(0,10);}
// ridimensiona la foto (max 1600 px) prima del caricamento
function shrink(file){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{const m=1600,k=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(new Error('Immagine non leggibile')),'image/jpeg',0.82);};
  im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Formato immagine non supportato'));};im.src=url;});}

async function reverseGeo(pt){

}

    ['Cortina e il lago','Campeggio','Cortina d\'Ampezzo',46.54,12.14,2,38,'Giro in bici intorno al lago e pizza al tramonto. Doccia calda, finalmente.'],
    ['Discesa verso casa','Solo passaggio','Trento',46.07,11.12,0,0,'Sosta pranzo e gelato in centro.']],Date.now()-1000);
  const tid=await mk('Esempio · Weekend in Maremma','Viaggio di prova: puoi modificarlo o eliminarlo.','Un weekend lungo di metà settembre, con Wanda piena di casse di vino e zero programmi rigidi. Siamo partiti dopo pranzo con la voglia di strade basse e colline.\n(Testo di esempio: sostituiscilo con il vostro.)','Il bagno a Talamone con l\'acqua ferma e nessuno intorno.',y+'-09-12',[
    ['Partenza e cena a Siena','Area sosta','Siena',43.318,11.331,1,18,'Sosta comoda a piedi dal centro. Carico e scarico acque disponibile.'],
    ['Pienza e il pecorino','Agriturismo','Pienza (Val d\'Orcia)',43.077,11.679,1,25,'Colazione con vista sulla valle. Pecorino stagionato da portare a casa.'],
    ['Mare a Talamone','Sosta libera','Talamone',42.551,11.128,2,0,'Parcheggio sotto la rocca. Acqua limpida e quasi nessuno a settembre.'],
    ['Rientro da Orvieto','Solo passaggio','Orvieto',42.718,12.111,0,0,'Pranzo e giro in funicolare.']],Date.now());
  S.tripId=tid;S.view=null;S.userView=false;renderAll();
}

/* ---------- avvio ---------- */
function lockUI(on){document.body.classList.toggle('locked',on);}
const EYE='<svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const pwField=(id,label,auto)=>`<div class="fld"><label for="${id}">${label}</label><div class="pwrow"><input id="${id}" type="password" required minlength="8" autocomplete="${auto}"><button type="button" class="pweye" data-eye="${id}" aria-label="Mostra password" title="Mostra password">${EYE}</button></div></div>`;
function wireEyes(root){root.querySelectorAll('[data-eye]').forEach(b=>b.onclick=()=>{const i=document.getElementById(b.dataset.eye);const show=i.type==='password';i.type=show?'text':'password';b.classList.toggle('on',show);b.setAttribute('aria-label',show?'Nascondi password':'Mostra password');});}
const authMsg=e=>{const m=(e&&e.message||'').toLowerCase();
  if(m.includes('invalid login'))return 'Email o password non corretti.';
  if(m.includes('email not confirmed'))return 'Questo account non è ancora confermato.';
  if(m.includes('should be different'))return 'La nuova password deve essere diversa da quella attuale.';
  if(m.includes('weak')||m.includes('at least'))return 'Password troppo semplice: usa almeno 8 caratteri.';
  if(m.includes('rate')||m.includes('too many'))return 'Troppi tentativi: aspetta qualche minuto e riprova.';
  if(m.includes('fetch'))return 'Nessuna connessione: riprova quando c\'è rete.';
  return 'Non è andata: '+(e&&e.message||'errore sconosciuto');};
function showLogin(msg){
  lockUI(true);S.loading=false;
  $('#content').innerHTML=`<div class="empty login"><h2>Entra nel diario</h2><p>Accedi con la tua email e la tua password.</p>
  <form id="fLogin" class="loginform"><div class="fld"><label for="lEmail">Email</label><input id="lEmail" type="email" required autocomplete="username" inputmode="email" placeholder="nome@esempio.it"></div>
  ${pwField('lPwd','Password','current-password')}
  <p class="err" id="lMsg">${esc(msg||'')}</p>
  <button class="btn primary wide" type="submit">Entra</button>
  <button class="linkbtn" type="button" id="lForgot">Password dimenticata o primo accesso?</button></form></div>`;
  wireEyes($('#content'));
  $('#fLogin').onsubmit=async e=>{e.preventDefault();const m=$('#lMsg');m.classList.remove('okmsg');m.textContent='Accesso in corso…';
    const{error}=await sb.auth.signInWithPassword({email:$('#lEmail').value.trim().toLowerCase(),password:$('#lPwd').value});
    if(error){m.textContent=authMsg(error);$('#lPwd').select();}else m.textContent='';};
  $('#lForgot').onclick=async()=>{const m=$('#lMsg'),em=$('#lEmail');const email=em.value.trim().toLowerCase();
    if(!email||!em.checkValidity()){m.classList.remove('okmsg');m.textContent='Scrivi prima la tua email qui sopra.';em.focus();return;}
    m.classList.remove('okmsg');m.textContent='Invio in corso…';
    const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
    if(error){m.textContent=authMsg(error);return;}
    m.classList.add('okmsg');m.textContent='Fatto: ti è arrivata una mail. Tocca il link e scegli la nuova password.';};
}
// dopo il link "reimposta password" della mail: si sceglie la password, poi si entra
function showSetPassword(session){
  lockUI(true);S.loading=false;
  $('#content').innerHTML=`<div class="empty login"><h2>Scegli la password</h2><p>Account: <b>${esc(session.user.email||'')}</b>. Almeno 8 caratteri; la userai per entrare da ogni dispositivo.</p>
  <form id="fNewPwd" class="loginform">${pwField('nPwd','Nuova password','new-password')}${pwField('nPwd2','Ripeti la password','new-password')}
  <p class="err" id="nMsg"></p><button class="btn primary wide" type="submit">Salva ed entra</button></form></div>`;
  wireEyes($('#content'));
  $('#fNewPwd').onsubmit=async e=>{e.preventDefault();const m=$('#nMsg');
    if($('#nPwd').value!==$('#nPwd2').value){m.textContent='Le due password non coincidono.';return;}
    m.textContent='Salvo…';const{error}=await sb.auth.updateUser({password:$('#nPwd').value});
    if(error){m.textContent=authMsg(error);return;}
    S.recovering=false;history.replaceState(null,'',location.pathname);startApp(session);};
}
// "Cambia password" dal menu, quando si è già dentro
function openPassword(){
  const f=$('#fPwd');
  f.innerHTML=`<h2>Cambia password</h2>${pwField('cPwd','Nuova password','new-password')}${pwField('cPwd2','Ripeti la password','new-password')}
  <p class="err" id="cMsg"></p><div class="foot"><span></span><div class="grp"><button class="btn ghost" type="button" id="cCancel">Annulla</button><button class="btn primary" type="submit">Salva</button></div></div>`;
  wireEyes(f);$('#ovPwd').classList.remove('hide');setTimeout(()=>$('#cPwd').focus(),30);
  $('#cCancel').onclick=()=>$('#ovPwd').classList.add('hide');
  f.onsubmit=async e=>{e.preventDefault();const m=$('#cMsg');m.classList.remove('okmsg');
    if($('#cPwd').value!==$('#cPwd2').value){m.textContent='Le due password non coincidono.';return;}
    m.textContent='Salvo…';const{error}=await sb.auth.updateUser({password:$('#cPwd').value});
    if(error){m.textContent=authMsg(error);return;}
    m.classList.add('okmsg');m.textContent='Password salvata.';setTimeout(()=>$('#ovPwd').classList.add('hide'),1200);};
}
let started=false;
async function startApp(session){
  if(started)return;started=true;lockUI(false);
  const email=(session.user.email||'').toLowerCase();S.email=email;
  let mem;try{mem=await sb.from('members').select('email').eq('email',email).maybeSingle();}catch(e){mem={error:e};}
  // senza rete: non esco dall'account, mostro la copia salvata
  if(mem.error&&!mem.data){if(goOffline(email))return;started=false;showOfflineEmpty();return;}
  if(!mem.data){started=false;await sb.auth.signOut();showLogin('L’email '+email+' non è tra quelle autorizzate a entrare nel diario.');return;}
  S.loading=true;renderAll();
  const [t,s]=await Promise.all([sb.from('trips').select('id,data'),sb.from('stops').select('id,data')]);
  if((t.error||s.error)&&goOffline(email))return;
  if(t.error||s.error){$('#notice').innerHTML='<p class="notice">Non riesco a leggere i dati: '+esc((t.error||s.error).message)+'</p>';}
  S.trips=(t.data||[]).map(r=>Object.assign({id:r.id},r.data));S.stops=(s.data||[]).map(r=>Object.assign({id:r.id},r.data));
  S.loading=false;renderAll();saveCache();signPhotos();
  let tmo=null;const later=()=>{clearTimeout(tmo);tmo=setTimeout(()=>{renderAll();signPhotos();},120);};
  sb.channel('wanda').on('postgres_changes',{event:'*',schema:'public',table:'trips'},p=>{if(p.eventType==='DELETE')removeLocal('trips',p.old.id);else upsertLocal('trips',p.new.id,p.new.data);later();})
    .on('postgres_changes',{event:'*',schema:'public',table:'stops'},p=>{if(p.eventType==='DELETE')removeLocal('stops',p.old.id);else upsertLocal('stops',p.new.id,p.new.data);later();}).subscribe();
}
function showOfflineEmpty(){
  lockUI(true);S.loading=false;
  $('#content').innerHTML='<div class="empty login"><h2>Nessuna connessione</h2><p>Non riesco a raggiungere il diario e su questo dispositivo non c\'è ancora una copia salvata. Riprova quando c\'è rete.</p><button class="btn primary" type="button" id="btnRetry">Riprova</button></div>';
  $('#btnRetry').onclick=()=>location.reload();
}
// installazione come app: pulsante nel menu (Android/computer) o istruzioni (iPhone/iPad)
let installEvt=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;$('#btnInstall').hidden=false;});
window.addEventListener('appinstalled',()=>{installEvt=null;$('#btnInstall').hidden=true;});
if(isIOS()&&!isStandalone())$('#btnInstall').hidden=false;
$('#btnInstall').onclick=async()=>{
  if(installEvt){installEvt.prompt();try{await installEvt.userChoice;}catch(e){}installEvt=null;$('#btnInstall').hidden=true;return;}
  $('#notice').innerHTML='<p class="notice">Per installare l\'app su iPhone o iPad: in Safari tocca <b>Condividi</b> (il quadrato con la freccia) e poi <b>Aggiungi alla schermata Home</b>.</p>';
  window.scrollTo({top:0,behavior:'smooth'});
};
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
function backup(){
  const data={app:'Wanda in viaggio',esportato:new Date().toISOString(),viaggi:S.trips,tappe:S.stops,nota:'Le foto restano nello spazio "foto" di Supabase: qui ci sono solo i loro nomi.'};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='wanda-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
mapEvents();initMap();
(async function boot(){
  const cfg=window.WANDA_CONFIG||{};
  if(!window.supabase||!cfg.supabaseUrl||!cfg.supabaseAnonKey||cfg.supabaseUrl.includes('INSERISCI')){
    lockUI(true);S.loading=false;$('#content').innerHTML='<div class="empty"><h2>Manca la configurazione</h2><p>Apri il file <b>config.js</b> e inserisci l’indirizzo del progetto Supabase e la chiave pubblica (anon). Le istruzioni sono nel file README.</p></div>';return;}
  // il link "reimposta password" arriva con type=recovery: lo leggo prima che Supabase pulisca l'indirizzo
  S.recovering=/type=recovery/.test(location.hash+location.search);
  sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
  $('#btnOut').onclick=async()=>{clearCache();try{await sb.auth.signOut();}catch(e){}location.reload();};
  $('#btnBackup').onclick=backup;
  $('#btnPwd').onclick=openPassword;
  sb.auth.onAuthStateChange((ev,session)=>{if(ev==='PASSWORD_RECOVERY')S.recovering=true;if(!session)return;
    if(S.recovering)setTimeout(()=>{if(!started)showSetPassword(session);},0);else startApp(session);});
  let session=null;try{({data:{session}}=await sb.auth.getSession());}catch(e){}
  if(session){if(S.recovering)showSetPassword(session);else startApp(session);return;}
  // senza rete e senza sessione leggibile: mostro comunque l'ultima copia salvata
  if(navigator.onLine===false&&goOffline())return;
  showLogin('');
})();
})();
</script>
